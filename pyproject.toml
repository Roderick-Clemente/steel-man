[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "evidence",
    "droid-wiki",
    "tests/fixtures",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
    "UP017", # datetime.UTC requires 3.11+; repo supports 3.10+
    "UP038", # isinstance(x, A | B) requires 3.10+; repo supports 3.10+
    "UP042", # enum.StrEnum requires 3.11+; repo supports 3.10+
    "B905",  # zip(strict=) requires 3.10+; repo supports 3.10+
]

[tool.ruff.lint.per-file-ignores]
# SHA-locked judge test files — cannot be modified without breaking
# test_chunk3_existing_judges_byte_unchanged. Suppress new ruff rules
# that fire on these files under newer ruff versions.
"tests/test_layout_paths*.py" = ["UP015", "UP036", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "evidence/",
    "droid-wiki/",
    "tests/fixtures/",
    ".venv/",
]
