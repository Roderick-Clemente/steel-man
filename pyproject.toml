[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "evidence",
    "droid-wiki",
    "tests/fixtures",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "evidence/",
    "droid-wiki/",
    "tests/fixtures/",
    ".venv/",
]
