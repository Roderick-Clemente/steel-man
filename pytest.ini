[pytest]
# Operational (not project metadata — keeps pyproject minimal).
# Tests directory: tests/ (test discovery no leading-underscore files).
testpaths = tests
addopts = -ra --strict-markers -q
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: tests that shell out to subprocess / read git state
    unit: pure data tests (default)

# Avoid walking the pilot's pytest config. pytest's top-level discovery
# should not crawl .venv. The path is auto-excluded by `--rootdir`, but
# make it explicit to avoid surprises.
#
# chunk-D1-2 moved the phase silos: the `phase-N` entries are gone and
# `evidence` (which now holds every build-evidence/ run tree, including the
# committed pilot test files under them) takes their place. `tools/phase-5-scripts`
# is excluded because `test_envelope_manifest.py` is a self-runner that lives
# beside its script rather than under `tests/`.
#
# `tests/fixtures` is excluded for a reason CHUNK-2-SPEC §2.3 did not enumerate:
# §2.1 moves `phase-1/fixtures/` to `tests/fixtures/phase-1/`, which puts
# `invalid-red/test_*.py` inside `testpaths`. Those files are DELIBERATELY
# invalid — negative fixtures for `tools/phase-1-scripts/valid-red.py`, one of
# them carrying an intentional unclosed-paren SyntaxError. Collecting them
# aborts the whole run. They are inputs, never tests.
norecursedirs = pilot .git evidence tools/phase-5-scripts tests/fixtures build-evidence node_modules .venv
