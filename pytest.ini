[pytest]
# Operational (not project metadata — keeps pyproject minimal).
# Tests directory: tests/ (test discovery no leading-underscore files).
testpaths = tests
addopts = -ra --strict-markers -q
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: tests that shell out to subprocess / read git state
    unit: pure data tests (default)

# Avoid walking the pilot's pytest config. pytest's top-level discovery
# should not crawl .venv. The path is auto-excluded by `--rootdir`, but
# make it explicit to avoid surprises.
norecursedirs = pilot .git phase-0 phase-1 phase-2 phase-3 phase-3.1 phase-3.2 phase-3.3 phase-4 phase-4.5 build-evidence node_modules .venv
