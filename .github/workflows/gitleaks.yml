name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege, arrived at in two steps because the first one was wrong.
#
# Originally there was no permissions block, so the default GITHUB_TOKEN could
# not post PR comments and gitleaks-action@v2 threw a RequestError and exited
# BEFORE scanning. Red check meaning "could not run", not "found a secret".
#
# The first fix set `contents: read` and turned comments off. That still failed,
# because an explicit permissions block zeroes every scope you do not name, and
# the action needs `pull-requests: read` to list the PR's commits and work out
# what range to scan. Same red X, same RequestError, different cause.
#
# read on both, comments off. Write is never granted: the check status is what
# gates the PR, and a secret scanner has no business holding a write token.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for scan of all commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_CONFIG: .gitleaks.toml
