name: Feature Request
description: Propose a new capability or improvement
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or friction does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should happen instead? Be concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - sprint-loop runner
        - gates
        - adapters
        - plan-lint
        - evidence provider
        - orchestrate-review.py
        - CI / Harness pipeline
        - documentation / skills
        - other
    validations:
      required: true
